# AegisStore edge: serves the React SPA and proxies /api to the backend on one origin
# (so session cookies and the CSRF origin check just work). /internal/* is never routed.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # single-upload limit (100 MB) + multipart/headers overhead
    client_max_body_size 110m;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # node <-> control-plane API is internal only (storage nodes call the api service directly)
    location /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Connection        "";

        # stream request and response bodies instead of spooling them to disk
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # hashed build assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback; index.html itself must never be cached
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
